[project]
name = "vomm"
version = "0.1.0"
description = "Implements 2 algorithms for variable order markov models"
authors = [
    { name = "Rod Gomez", email = "armyofthepenguin@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL v3"}
dependencies = [
    "numpy>=2.3.3",
    "scipy>=1.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"